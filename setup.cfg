# --- Project configuration -------------------------------------------------

[metadata]
name = fs-next
version = attr: fs._version.__version__
author = The PyFilesystem2 contributors
maintainer = Mason Kim
url = https://github.com/kmsk99/fs-next
project_urls =
    Source = https://github.com/kmsk99/fs-next
    Issues = https://github.com/kmsk99/fs-next/issues
    Changelog = https://github.com/kmsk99/fs-next/releases
license = MIT
license_files = LICENSE
description = A maintenance fork of PyFilesystem2 for modern Python
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: System :: Filesystems

[options]
zip_safe = false
packages = find:
python_requires = >=3.10
install_requires =
    appdirs>=1.4.3,<2
    six>=1.10,<2

[options.extras_require]
test =
    pytest>=8,<10
    parameterized>=0.9,<1
    pyftpdlib>=2,<3
    pyOpenSSL>=24,<27

[options.packages.find]
exclude = tests

[options.package_data]
fs = py.typed

# --- Individual linter configuration ---------------------------------------

[pydocstyle]
inherit = false
ignore = D102,D105,D200,D203,D213,D406,D407
match-dir = (?!tests)(?!docs)[^\.].*
match = (?!test)(?!setup)[^\._].*\.py

[mypy]
ignore_missing_imports = true

[mypy-fs.*]
disallow_any_decorated = false
disallow_any_generics = false
disallow_any_unimported = true
disallow_subclassing_any = true
disallow_untyped_calls = false
disallow_untyped_defs = false
ignore_missing_imports = false
warn_unused_ignores = false
warn_return_any = false

[mypy-fs.test]
disallow_untyped_defs = false

[flake8]
extend-ignore = E203,E402,W503
max-line-length = 88
per-file-ignores =
    fs/__init__.py:F401
    fs/*/__init__.py:F401
    tests/*:E501
    fs/opener/*:F811
    fs/_fscompat.py:F401
    fs/_pathcompat.py:C401

[isort]
default_section = THIRDPARTY
known_first_party = fs
known_standard_library = sys, typing
line_length = 88
profile = black
skip_gitignore = true

# --- Test and coverage configuration ------------------------------------------

[coverage:run]
branch = true
omit = fs/test.py
source = fs
relative_files = true
parallel = true

[coverage:report]
show_missing = true
skip_covered = true
exclude_lines =
    pragma: no cover
    if False:
    it typing.TYPE_CHECKING:
    @typing.overload
    @overload

[tool:pytest]
filterwarnings =
    error::DeprecationWarning:fs(\.|$)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
