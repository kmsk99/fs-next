name: Compatibility
on: [push, pull_request, workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  upstream-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install . "pytest<9" parameterized "pyftpdlib==1.5.10" psutil "setuptools<81"
      - run: |
          python -m pip download --no-deps --no-binary=:all: fs==2.4.16 -d .local/upstream-dist
      - run: python -I scripts/check_upstream_tests.py .local/upstream-dist/fs-2.4.16.tar.gz
  upstream-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install upstream and candidate separately
        run: |
          python -m venv .local/upstream
          python -m venv .local/candidate
          .local/upstream/bin/python -m pip install "setuptools<81" fs==2.4.16
          .local/candidate/bin/python -m pip install .
      - name: Compare API and behavior with PyPI fs 2.4.16
        run: |
          BASELINE=$(.local/upstream/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python scripts/check_upstream_api.py "$BASELINE/fs" fs
          .local/upstream/bin/python -I scripts/check_feature_parity.py > .local/upstream.json
          .local/candidate/bin/python -I scripts/check_feature_parity.py > .local/candidate.json
          diff -u .local/upstream.json .local/candidate.json
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests -q -W error::pytest.PytestUnraisableExceptionWarning -W error::pytest.PytestUnhandledThreadExceptionWarning
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      # pyfatfs still declares Requires-Dist: fs. Probe its API without installing
      # the conflicting upstream distribution; this is not a supported resolver fix.
      - run: python -m pip install --no-deps pyfatfs==1.1.0
      - run: python scripts/check_pyfatfs.py
  s3-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare local plugin metadata migration
        run: |
          mkdir -p .local/plugin-source
          python -m pip download --no-deps --no-binary=:all: fs-s3fs==1.1.1 -d .local/plugin-source
          tar -xzf .local/plugin-source/fs-s3fs-1.1.1.tar.gz -C .local/plugin-source
          python scripts/prepare_s3fs_probe.py .local/plugin-source/fs-s3fs-1.1.1
      - name: Install with normal dependency resolution
        run: python -m pip install . ./.local/plugin-source/fs-s3fs-1.1.1 "moto[s3]==5.2.3"
      - run: python -m pip check
      - run: python scripts/check_s3fs.py
