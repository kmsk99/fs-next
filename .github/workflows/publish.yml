name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/test.yml
  preview:
    uses: ./.github/workflows/python-preview.yml
  build:
    needs: [tests, preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path('fs/_version.py')['__version__']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Build release documentation
        run: |
          python -m pip install . -r docs/requirements.txt
          python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - name: Check installed wheel without setuptools
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/python -I scripts/check_wheel.py
          /tmp/wheel-check/bin/python -m pip install -r tests/requirements.txt
          /tmp/wheel-check/bin/python -I scripts/check_installed_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fs-next
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
