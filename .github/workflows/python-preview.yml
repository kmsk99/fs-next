name: Python preview
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests -q -ra -W error::DeprecationWarning:fs -W error::pytest.PytestUnraisableExceptionWarning -W error::pytest.PytestUnhandledThreadExceptionWarning
